[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#0f1729"
borderColor = "#e3e6ec"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "monospace"
baseFontSize = 14
headingFontSizes = ["1.6rem", "1.25rem", "1.05rem", "0.95rem", "0.9rem", "0.85rem"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
baseRadius = "6px"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#f4f5f7"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0f1729"
secondaryBackgroundColor = "#1b2540"
textColor = "#e6e9f0"
borderColor = "#2a3554"
primaryColor = "#6ea8ff"

[server]
headless = true

[client]
toolbarMode = "minimal"
